的历史实验补充可扫描文本证据，尤其适合DIY清单、步骤、配送与总价这种任务性信息。", "scope": "明确美国加州实验地点；81人含三个研究，定量51人；不能说81人都参与5版本实验。", "limitation": "不是全体美国人的审美偏好调查，也不是PixelKnot增单证明；本项主要用于交代US-E5样本来源，不能当独立复制实验。", "quote": "We conducted three studies in which a total of 81 users read Web pages. The first two studies were exploratory and qualitative and were aimed at generating insight into how users read and what they like and dislike. The third study was a measurement study aimed at quantifying the potential benefits from some of the most promising writing styles identified in the first two studies. All three studies were conducted during the summer of 1997 in the SunSoft usability laboratories in Menlo Park, CA.", "published": "页面标1997-01-01；正文实验为1997夏，日期元数据不一致", "url": "https://www.nngroup.com/articles/concise-scannable-and-objective-how-to-write-for-the-web/", "file": "research/us-shopping/nng-concise.txt"}, "US-E7": {"title": "Nielsen Norman Group — Memory Recognition and Recall in User Interfaces", "kind": "通用可用性研究", "value": "选择2 Pack时让已选1/2、所选商品、总价和下一步始终可见；“Choose your second design”比笼统“Select Products”更能提示当前任务。", "detail": "选择2 Pack时让已选1/2、所选商品、总价和下一步始终可见；“Choose your second design”比笼统“Select Products”更能提示当前任务。", "scope": "一般认知和可用性原则；没有特定美国购买者样本或转化数值。", "limitation": "“Select Products”不是不地道英语；改变是减少状态歧义的实验，不是禁止美国网站使用该词。", "quote": "How do you promote recognition? By making information and interface functions visible and easily accessible.", "published": "2024-01-15", "url": "https://www.nngroup.com/articles/recognition-and-recall/", "file": "research/us-shopping/nng-recognition.txt"}, "US-E8": {"title": "NIST — SI Units: Length / inch definition", "kind": "单位定义", "value": "8×12英寸应换算20.32×30.48厘米，不能等同A4的21×29.7厘米；实测后并列英寸和公制，标明画芯与外框。", "detail": "8×12英寸应换算20.32×30.48厘米，不能等同A4的21×29.7厘米；实测后并列英寸和公制，标明画芯与外框。", "scope": "美国国家标准与技术研究院，单位定义；是算术/事实来源，不是消费者偏好研究。", "limitation": "该来源只证明换算，不证明美国用户一定喜欢英寸优先。英寸优先可参考美国在售页面并通过美国目标用户任务测试确认。", "quote": "The value for the inch, derived from the value of the Yard ef -29", "quote": "In testing, such ranges performed better than ranges of delivery speed (e.g., “3–7 Business Days”) because they were significantly easier for participants to interpret.", "scope": "电商可用性测试及基准，包含美国与英国零售页面；不是美国人口代表性调查。", "implication": "可以可靠计算时，优先呈现预计到达日期范围，而非要求用户自己加上处理、周末、假日和运输天数。", "limitation": "当前PixelKnot“发出后3–5工作日”并非错误；到达日期只有在库存、ZIP、截单、处理及承运商数据可靠时才能发布。原文未发现Get it by/Arrives等具体措辞有一致优胜。", "numbers": [{"value": "41%", "meaning": "文中基准站没有提供delivery date；不是41%的购物者弃购"}], "source_local": "research/us-shopping/baymard-delivery-date.txt", "sha256": "94d12adab1e568bf37db326b21a3dd55ffcf215e56ff1f2ca15c7be239737055", "quote_verified": true}, {"id": "US-E3", "url": "https://baymard.com/research-articles/show-shipping-costs-on-product-pages", "title": "Baymard — Product Pages Need to Show Estimated Shipping Costs", "published_or_updated": "2017-06-20", "captured_date": "2026-10-29", "quote": "Our new Product Page study reveals that 64% of users looked for shipping costs on the product page, before deciding to add a product to the cart.", "scope": "2017商品页可用性研究，文中举Walmart、KitchenAid等美国零售例子，并说明国际用户也有相同需求；64%不可写成2026全体美国消费者比例。", "implication": "保留PixelKnot购买区的Free standard U.S. shipping，它比只在顶栏写优惠更贴近购买决定；补齐适用范围及税费条件。", "limitation": "这是既有优点的证据，不应称PixelKnot没写运费。旧研究的行为数值不代表目前店铺预期增幅。", "numbers": [{"value": "64%", "meaning": "研究中加购决定前在商品页寻找运费的用户"}], "source_local": "research/us-shopping/baymard-shipping-costs.txt", "sha256": "deb831775e76f7b22e9390072081920cfc9895b859683d8ec2efd7199c7e2ad1", "quote_verified": true}, {"id": "US-E4", "url": "https://baymard.com/research-articles/footer-needs-return-shipping-links", "title": "Baymard — Direct Return Policy and Shipping Info Links", "published_or_updated": "2019-01-16", "captured_date": "2026-10-29", "quote": "During testing, many users voiced their questions regarding return policies and procedures when buying online — for example, Can the item be returned? Do I have to pay for return shipping myself? How long do I have to return an item? Does that deadline include the shipping time?", "scope": "电商桌面/手机可用性测试，原文提到1000+场有主持实验、并从2012至2019观察页脚查找；没有声明美国人口代表性。", "implication": "退货入口用Returns & Refunds / Shipping等可识别标签；写清期限起算点、退运责任、缺件和退款流程。", "limitation": "PixelKnot已有页脚直接政策链接，应该保留。无需为“美国习惯”承诺无条件或免费退货；承诺取决于真实政策。", "numbers": [{"value": "20%", "meaning": "文章中基准站缺少页脚直接退货/配送链接；不是顾客流失比例"}], "source_local": "research/us-shopping/baymard-returns.txt", "sha256": "931827a95eb830e5d43d673e0b34f960744bdb569bf06542023d75dc58e16a0f", "quote_verified": true}, {"id": "US-E5", "url": "https://www.nngroup.com/articles/how-users-read-on-the-web/", "title": "Nielsen Norman Group — How Users Read on the Web", "published_or_updated": "1997-09-30（网页元数据另标1997-10-01，2024修订）", "captured_date": "2026-10-29", "quote": "To measure the effect of some of the content guidelines we had identified, we developed five different versions of the same website (same basic information; different wording; same site navigation). We then had users perform the same tasks with the different sites. As shown in the table, measured usability was dramatically higher for the concise version (58% better) and for the scannable version (47% better).", "scope": "历史网站任务实验；配套完整研究说明1997夏美国加州Menlo Park，总81人，定量实验51人。不是现代移动电商转化实验。", "implication": "把文学性长段落后的具体购买事实前移，先给短标题、关键事实和要点，再保留品牌故事。", "limitation": "58%/47%是可用性复合指标提升，不是购买率或加购率；年代久远，仅支持可扫描表达的方向。", "numbers": [{"value": "58%", "meaning": "该实验简洁文本的可用性指标相对改善"}, {"value": "47%", "meaning": "该实验可扫描文本的可用性指标相对改善"}], "source_local": "research/us-shopping/nng-scanning.txt", "sha256": "6b56b6ecab7afb8b0aad4258986bfeaac50e5a8c3698aa5febb7ed3a92f872d2", "quote_verified": true}, {"id": "US-E6", "url": "https://www.nngroup.com/articles/concise-scannable-and-objective-how-to-write-for-the-web/", "title": "Nielsen Norman Group — Concise, Scannable, and Objective", "published_or_updated": "页面标1997-01-01；正文实验为1997夏，日期元数据不一致", "captured_date": "2026-10-29", "quote": "We conducted three studies in which a total of 81 users read Web pages. The first two studies were exploratory and qualitative and were aimed at generating insight into how users read and what they like and dislike. The third study was a measurement study aimed at quantifying the potential benefits from some of the most promising writing styles identified in the first two studies. All three studies were conducted during the summer of 1997 in the SunSoft usability laboratories in Menlo Park, CA.", "scope": "明确美国加州实验地点；81人含三个研究，定量51人；不能说81人都参与5版本实验。", "implication": "以美国执行的历史实验补充可扫描文本证据，尤其适合DIY清单、步骤、配送与总价这种任务性信息。", "limitation": "不是全体美国人的审美偏好调查，也不是PixelKnot增单证明；本项主要用于交代US-E5样本来源，不能当独立复制实验。", "numbers": [{"value": "81人", "meaning": "三个历史研究总人数"}, {"value": "51人", "meaning": "五版本定量可用性研究人数"}], "source_local": "research/us-shopping/nng-concise.txt", "sha256": "8ae4ec157a70566326c6d4ace511e0c06d74f0af290aaa0cf61f2103fe022b1c", "quote_verified": true}, {"id": "US-E7", "url": "https://www.nngroup.com/articles/recognition-and-recall/", "title": "Nielsen Norman Group — Memory Recognition and Recall in User Interfaces", "published_or_updated": "2024-01-15", "captured_date": "2026-10-29", "quote": "How do you promote recognition? By making information and interface functions visible and easily accessible.", "scope": "一般认知和可用性原则；没有特定美国购买者样本或转化数值。", "implication": "选择2 Pack时让已选1/2、所选商品、总价和下一步始终可见；“Choose your second design”比笼统“Select Products”更能提示当前任务。", "limitation": "“Select Products”不是不地道英语；改变是减少状态歧义的实验，不是禁止美国网站使用该词。", "numbers": [], "source_local": "research/us-shopping/nng-recognition.txt", "sha256": "968e6b6d317beab5bb0cea533758d83daa4d0b497f2621252f310245ac6c165d", "quote_verified": true}, {"id": "US-E8", "url": "https://www.nist.gov/pml/owm/si-units-length", "title": "NIST — SI Units: Length / inch definition", "published_or_updated": "以2026-10-29抓取页面为准；定义源于1959公告", "captured_date": "2026-10-29", "quote": "The value for the inch, derived from the value of the Yard effective July 1, 1959, is exactly equivalent to 25 function sourcePage(){return pageHead('Data & evidence','结论由什么支撑','先区分现场事实、给定计数、第三方样本、明确假设与缺失数据，再决定该直接纠正还是做实验。')+`<div class="grid three">${[['green','现场事实','截图、页面原文和低影响选项复核'],['amber','描述性数据','用户给定聚合计数与外部样本，口径分开'],['','待验证策略','没有模块因果数据；明确指标和实验条件']].map(([c,t,d])=>`<div class="panel">${tag(t,c)}<p class="muted spaced">${d}</p></div>`).join('')}</div><div class="section-heading"><h2>数据台账</h2><a href="dashboard-data.json" target="_blank">下载结构化数据 ↗</a></div><div class="grid two">${Object.entries(DATA.sources).map(([id,s])=>`<article class="source-card" id="source-${id}"><div class="tag-row">${tag(id)}${tag(s.kind,s.kind.includes('待')?'amber':'green')}</div><h3 style="margin-top:12px">${esc(s.title)}</h3><div class="value">${esc(s.value)}</div><p>${esc(s.detail)}</p><div class="foot">${urlLink(s.url)}${s.file?urlLink(s.file,'本地证据 ↗'):''}${s.raw?urlLink(s.raw,'原始 DOM ↗'):''}</div></article>`).join('')}</div><div class="panel spaced"><h3>复核范围与留存</h3><p class="muted spaced">参考页按2026-10-29快照比较，价格、评价和促销可能变化。截图用于核对真实页面，所示响应式尺寸与模块位置可能不同，截图未展示的具体文字以摘录和原文核验。没有执行加购、结账、支付或线上主题写入。</p><div class="reference-meta"><a href="verification-manifest.json" target="_blank">证据文件与SHA-256 ↗</a><a href="research/quote-audit.json" target="_blank">30条原文复核记录 ↗</a></div></div>${legal()}`}

nel()}</section><div class="panel spaced"><h3>落地与验收顺序</h3><div class="step"><span class="step-num">1</span><div><h4>事实先核实</h4><p>测量当前SKU；核对优惠资格、盒内物品、客服时区、教程与真实售后条件。</p></div></div><div class="step"><span class="step-num">2</span><div><h4>用美国目标顾客做购买任务测试</h4><p>请真实新客回答买几套、付多少、含什么、如何做、何时到；记录理解错误和操作路径，不以单纯“喜欢哪个”替代。</p></div></div><div class="step"><span class="step-num">3</span><div><h4>一轮只测一个主要变化</h4><p>理解清晰后再做同期随机对照。加购与Bundle完成率作近端指标，购买率、每会话贡献和退款作商业护栏；不预设无依据的增幅。</p></div></div><div class="reference-meta">${urlLink('research/us-shopping/independent-audit.json','独立证据审核 ↗')}${urlLink('research/us-shopping/final-patterns.json','五种形式结构化资料 ↗')}${urlLink('research/us-shopping/final-evidence.json','研究引文资料 ↗')}</div></div>${legal()}`}

function ugReferencePanel(m){let idx=ugReferences[m.id]||0,r=m.references[idx];return `<div class="section-heading"><div><h3>每个方向 · 五个具体网页对照</h3><p>选择案例，逐项查看原文、差距、可借鉴做法与不能照搬的条件。</p></div>${tag('5 个不同URL','green')}</div><div class="reference-tabs ug-ref-tabs" role="tablist" aria-label="美国专营优化的五个参考网页">${m.references.map((r,j)=>`<button role="tab" aria-selected="${idx===j}" class="${idx===j?'active':''}" data-ug-ref="${j}" data-ug-module="${esc(m.id)}">${j+1}. ${esc(r.brand)}<span>${esc(r.page||'相关零售页面')}</span></button>`).join('')}</div><div class="comparison-grid ug-compare">${capture(m.current_image,'PixelKnot · 当前页面','2026-10-29真实页面定位图；具体判断以现场原文及政策为准',`<h4>我们现在怎样</h4><p>${esc(m.current)}</p>`)}${r.screenshot?capture(r.screenshot,esc(r.brand)+' · 参考页面',r.screenshot_scope||'真实页面定位截图；引用文字以留存原文为准',`<h4>参考怎样做</h4><p>${esc(r.observed)}</p>`):`<article class="panel ug-text-reference"><div class="tag-row">${tag(r.brand)}${tag('原文核验 · 本项无截图','amber')}</div><h3 class="spaced">${esc(r.page||'相关零售页面')}</h3><div class="quote">${r.quotes.map(q=>`<blockquote lang="en-US">“${esc(q)}”</blockquote>`).join('')}</div><p>${esc(r.observed)}</p><div class="reference-meta">${urlLink(r.url)}${urlLink(r.source_local,'留存原文 ↗')}</div><p class="small muted spaced">未用其它页面或生成图片冒充此处截图。</p></article>`}</div><div class="panel spaced ug-ref-detail"><h3>${esc(r.brand)}：差距与应用条件</h3><div class="quote">${r.quotes.map(q=>`<blockquote lang="en-US">“${esc(q)}”</blockquote>`).join('')}</div><table class="difference-table"><tbody><tr><th>参考怎样做</th><td>${esc(r.observed)}</td></tr><tr><th>我们怎样做</th><td>${esc(m.current)}</td></tr><tr class="action-row"><th>差距与具体改法</th><td>${esc(r.application||m.recommendation)}</td></tr><tr><th>美国适用范围</th><td>${esc(r.market_fit_note||'借鉴购买信息结构；页面功能不代表全部美国消费者的共同偏好。')}</td></tr><tr><th>真实数据边界</th><td>${esc(r.public_business_signal||'本项以可核验页面原文与功能作为证据，没有可直接归因到该模块的公开成交率。')}<p class="small muted">${esc(r.signal_scope||'公开评价或客户数不等于经审计订单，也不能证明某个设计导致高转化。')}</p></td></tr><tr><th>不要照搬</th><td>${esc(r.limits||r.limitation||'价格、服务、产品事实与优惠均按我们自己的真实能力核对。')}</td></tr></tbody></table><div class="reference-meta">${urlLink(r.url)}${urlLink(r.source_local,'留存原文 ↗')}</div><details class="ug-hash"><summary>证据校验信息</summary><p class="small muted">抓取：2026-10-29<br>SHA-256：<code>${esc(r.source_sha256||'见总证据清单')}</code></p></details></div><details class="all-reference ug-all-refs"><summary><strong>展开全部五个案例原文</strong><span>保留参考的差别与使用限制</span></summary><div class="inner">${m.references.map(r=>`<article class="ug-all-row"><h4>${esc(r.brand)} · ${esc(r.page||'具体参考网页')}</h4><p class="small spaced">${esc(r.observed)}</p><div class="quote">${r.quotes.map(q=>`<blockquote lang="en-US">“${esc(q)}”</blockquote>`).join('')}</div><p class="small"><strong>用于我们：</strong>${esc(r.application||m.recommendation)}</p><p class="small muted spaced"><strong>边界：</strong>${esc(r.limits||r.limitation)}</p><div class="reference-meta">${urlLink(r.url)}${urlLink(r.source_local,'留存原文 ↗')}</div></article>`).join('')}</div></details>`}
function ugModulePanel(){let m=DATA.us_growth.modules[ugSelected];return `<section class="panel ug-module-intro"><div class="panel-title"><div><div class="eyebrow">U.S. GROWTH 0${ugSelected+1} / 05</div><h2>${esc(m.title)}</h2></div>${tag(m.priority,'amber')}</div><div class="ug-design-grid"><div class="flow"><div class="ug-current"><h4>当前已确认</h4><p>${esc(m.current)}</p>${ugEvidence(m.evidence)}</div><h4>为什么值得继续优化</h4><p>${esc(m.gap)}</p>${ev(m.research||[])}<div class="ug-next"><h4>建议改变 / 增加</h4><p>${esc(m.recommendation)}</p></div>${ugList(m.actions).map((a,j)=>`<div class="step"><span class="step-num">${j+1}</span><div>${esc(a)}</div></div>`).join('')}</div><div><div class="ug-preview-heading">${tag('英文组件示意 · 未上线','amber')}<span>真实事实核对后才能发布</span></div>${ugMock(ugSelected)}</div></div><details class="ug-copy-details"><summary>英文候选与发布前条件</summary><div class="grid two spaced"><div class="us-copy" lang="en-US">${ugList(m.copy).map(c=>`<div>${esc(c)}</div>`).join('')}</div><div><h4>使用条件</h4><ul class="ug-list">${ugCopy(m.conditions)}</ul></div></div></details></section><div class="ug-measure-grid spaced"><article class="panel"><div class="eyebrow">MEASUREMENT</div><h3>用什么数据判断有效</h3><ul class="ug-list">${ugCopy(m.metrics)}</ul><p class="small muted">当前没有本模块的因果增幅数据，不填入预计提升百分比。</p></article><article class="panel"><div class="eyebrow">EXPERIMENT</div><h3>怎样验证</h3><p class="spaced">${esc(m.experiment)}</p><div class="notice neutral spaced">美国市场内部仍有不同购买任务。保持渠道、商品与设备结构可比；优先用同期随机对照，购买率和每会话贡献作为商业护栏。</div></article></div>${ugReferencePanel(m)}`}
function ugMobilePanel(){let a=DATA.us_growth.mobile_audit||{};return `<section class="panel spaced ug-mobile-audit"><div class="panel-title"><div><div class="eyebrow">CROSS-MODULE CHECK</div><h2>同时验收：美国手机端购买操作</h2></div>${tag('可复现问题先修复','green')}</div><div class="ug-mobile-grid"><div class="flow"><p>${esc(a.current)}</p>${ugEvidence(a.evidence)}<ul class="ug-list">${ugCopy(a.actions)}</ul><p class="small muted"><strong>观察与验收：</strong>${ugList(a.metrics).map(esc).join('；')}</p><div class="notice neutral">不能从重复DOM节点推断视觉上有八条横幅，也不能从截图判断Core Web Vitals不合格。聊天入口、固定购买条和弹窗需在实际手机尺寸下验收。</div></div>${a.image?capture(a.image,'手机购买区 · 真实现场','图片用于核对浮层和购买信息的位置；不代表所有设备均有同一问题',''):''}</div><details class="all-reference spaced"><summary><strong>这组操作检查的5个结构参考</strong><span>复用已核验页面；未断言它们没有手机或无障碍问题</span></summary><div class="inner">${(a.references||[]).map(r=>`<div class="ug-all-row"><h4>${esc(r.brand)} · ${esc(r.page)}</h4><p class="small spaced">${esc(r.observed)}</p><div class="quote">${r.quotes.map(q=>`<blockquote>${esc(q)}</blockquote>`).join('')}</div><div class="reference-meta">${urlLink(r.url)}${urlLink(r.source_local,'留存原文 ↗')}</div></div>`).join('')}<p class="small muted spaced">这里只参考清楚的任务标签、选项和下一步。聊天浮层、键盘焦点、减少动画及性能仍须按PixelKnot实际设备验收；没有来自这些案例的转化增幅承诺。</p></div></details></section>`}
function usGrowthPage(){let g=DATA.us_growth,urls=new Set(g.modules.flatMap(m=>m.references.map(r=>r.url)));return pageHead('U.S.-only store / next optimization round','美国专营 · 下一轮优化','把美国市场定位落实到可兑现的履约、送礼、组合用途、真实制作与订单复核。每个方向均给五个具体零售网页，逐项比较我们现在怎样、差距在哪、如何验证。',tag('5 个方向 · 25 组用途对照','green'))+`<section class="ug-hero"><div><div class="eyebrow">Make the purchase decision easier</div><h2>继续优化整条购买路径，<br>让顾客更容易确认自己买对了。</h2><p>保留已有DIY说明、优惠解释、制作图库和免运摘要。下一轮增加SKU级履约条件、送礼用途、可编辑推荐组合、真实新手过程和购买前复核。</p></div><div class="ug-hero-stats"><div><b>5 × 5</b><span>每个方向5个不同参考URL</span></div><div><b>${urls.size}</b><span>具体网页，跨方向复用相关页</span></div><div><b>已核实</b><span>加州退货地址 / 真实政策条件</span></div><div><b>待采集</b><span>Bundle使用率 / 模块因果效果</span></div></div></section><div class="grid two spaced"><article class="panel ug-policy"><div class="tag-row">${tag('本轮政策复核','green')}</div><h3 class="spaced">把已有的美国履约优势说清楚</h3><p class="spaced">${esc(g.policy?.summary||'现有政策区分美国现货与海外履约商品，并提供美国退货地址；各SKU适用条件仍须核对。')}</p><ul class="ug-list">${ugCopy(g.policy?.conditions||[])}</ul><button class="evidence-btn" data-evidence="UG-P1">查看配送依据 ↗</button><button class="evidence-btn" data-evidence="UG-P2">查看退货依据 ↗</button></article><article class="panel"><div class="tag-row">${tag('数据解释边界','amber')}</div><h3 class="spaced">有证据支持方向，效果仍需本店验证</h3><p class="spaced">历史商品页入口加购为311/7,592＝4.10%，购买为183/7,592＝2.41%；沿用用户提供计数，本轮未取得原始后台导出。</p><p class="small muted spaced">统计范围为2026年10月1–22日、美国手机端Human商品页入口会话；不是任一模块造成的损失。参考网页原文说明可借鉴结构，公开评价数字不能证明其页面设计带来高转化。</p>${ev(['B1','B2','US-E1'])}</article></div><div class="section-heading"><div><h2>五个新增方向，逐个比较</h2><p>每个方向包含当前证据、改变建议、英文组件、五个案例与实验指标。</p></div></div><div class="ug-module-tabs" role="tablist" aria-label="美国专营的五个优化方向">${g.modules.map((m,i)=>`<button role="tab" aria-selected="${ugSelected===i}" class="${ugSelected===i?'active':''}" data-ug-module-tab="${i}"><span>0${i+1}</span><b>${esc(m.short||m.title)}</b></button>`).join('')}</div><div id="ug-module-content">${ugModulePanel()}</div>${ugMobilePanel()}<div class="panel spaced"><h3>建议实施顺序</h3><div class="step"><span class="step-num">1</span><div><h4>先统一事实与配置</h4><p>测量SKU、核对配送地区与仓库、退货资格、礼物服务、装箱清单和优惠逻辑；已复现的价格或操作错误优先修复。</p></div></div><div class="step"><span class="step-num">2</span><div><h4>再做美国目标新客任务测试</h4><p>验证顾客能否找到适合的款式、确认DIY属性和总价、理解何时收到与如何完成；记录错误与过程，不只问喜欢哪个设计。</p></div></div><div class="step"><span class="step-num">3</span><div><h4>一次验证一个主要变化</h4><p>保持优惠不变，分别测试送礼入口、场景推荐或视频主题标签。Bundle购买必须通过真实订单标记识别，多件订单不自动等于Bundle。</p></div></div><div class="reference-meta">${urlLink('research/us-only/independent-reference-audit.json','本轮引文复核 ↗')}${urlLink('research/us-only/pixelknot-policies-clean.txt','政策原文摘要 ↗')}${urlLink('research/us-only/site-audit.json','独立现场审查 ↗')}</div></div>${legal()}`}
function ugRefresh(){let y=window.scrollY;$('#ug-module-content').innerHTML=ugModulePanel();$$('[data-ug-module-tab]').forEach(b=>{let active=Number(b.dataset.ugModuleTab)===ugSelected;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});window.scrollTo({top:y,behavior:'instant'})}
document.addEventListener('click',e=>{let el=e.target.closest('[data-ug-module-tab]');if(el){ugSelected=Number(el.dataset.ugModuleTab);ugRefresh();return}el=e.target.closest('[data-ug-ref]');if(el){ugReferences[el.dataset.ugModule]=Number(el.dataset.ugRef);ugRefresh()}});

render(location.hash.slice(1)||'overview');
</script></body></html>
